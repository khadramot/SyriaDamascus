<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>خضرموت</title>
    <!-- مكتبة الأيقونات (Font Awesome) لتزيين الأزرار -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        /* -------------------- */
        /* 1. إعدادات الخلفية العامة */
        /* -------------------- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            /* ★★★ غيّر رابط الصورة هنا إلى خلفيتك التي تريدها ★★★ */
            background-image: url('https://images.unsplash.com/photo-1518655048521-f130df041f66?w=1600'); 
            background-size: cover;          /* تجعل الصورة تغطي الشاشة كاملة */
            background-position: center;     /* توسيط الصورة */
            background-attachment: fixed;    /* تثبيت الخلفية عند التمرير */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            text-align: center;
            direction: rtl; /* محاذاة النصوص من اليمين (للعربية) */
        }

        /* طبقة شفافة فوق الخلفية لجعل النص مقروءاً بشكل أفضل */
        body::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4); /* اسود شفاف بنسبة 40% */
            z-index: 0;
        }

        /* الحاوية الأساسية (توضع فوق الطبقة الشفافة) */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            padding: 20px;
        }

        /* ----------------------------------- */
        /* 2. النص الافتتاحي (عدّله كما تريد) */
        /* ----------------------------------- */
        .hero-text {
            color: #ffffff;
            margin-bottom: 50px;
            text-shadow: 0 4px 15px rgba(0, 0, 0, 0.7);
        }

        .hero-text h1 {
            font-size: 3.5rem;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .hero-text p {
            font-size: 1.4rem;
            opacity: 0.95;
            font-weight: 300;
        }

        /* ----------------------------------- */
        /* 3. المستطيلات الثلاثة (البطاقات)   */
        /* ----------------------------------- */
        .cards-wrapper {
            display: flex;
            flex-wrap: wrap;          /* للتوافق مع الجوال */
            justify-content: center;
            gap: 30px;               /* المسافة بين المستطيلات */
        }

        .card {
            background: rgba(255, 255, 255, 0.15);  /* زجاج شفاف */
            backdrop-filter: blur(12px);            /* تأثير الضبابية الزجاجية */
            -webkit-backdrop-filter: blur(12px);
            border-radius: 24px;
            padding: 40px 30px;
            width: 220px;
            border: 1px solid rgba(255, 255, 255, 0.25);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            text-decoration: none;   /* لإزالة الخط السفلي للروابط */
            color: white;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        /* حركة عند تمرير الماوس (تأثير جميل) */
        .card:hover {
            transform: translateY(-15px) scale(1.02);
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
        }

        /* أيقونة داخل المستطيل */
        .card i {
            font-size: 4.5rem;
            margin-bottom: 15px;
            filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.3));
        }

        /* اسم المنصة أسفل الأيقونة */
        .card span {
            font-size: 1.6rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.5);
        }

        /* ---- الألوان الخاصة بكل منصة (لون الأيقونة والحدود الخفيفة) ---- */
        .card-facebook i {
            color: #1877f2;
        }
        .card-facebook {
            border-bottom: 5px solid #1877f2;
        }

        .card-telegram i {
            color: #0088cc;
        }
        .card-telegram {
            border-bottom: 5px solid #0088cc;
        }

        .card-whatsapp i {
            color: #25d366;
        }
        .card-whatsapp {
            border-bottom: 5px solid #25d366;
        }

        /* ---------------------------- */
        /* 4. تنسيق الجوال (شاشات صغيرة) */
        /* ---------------------------- */
        @media (max-width: 700px) {
            .hero-text h1 {
                font-size: 2.5rem;
            }
            .hero-text p {
                font-size: 1.1rem;
            }
            .card {
                width: 180px;
                padding: 30px 20px;
            }
            .card i {
                font-size: 3.5rem;
            }
            .card span {
                font-size: 1.3rem;
            }
        }
    </style>
</head>
<body>

    <div class="container">

        <!-- ======================================== -->
        <!-- ★★★  عدّل النص الافتتاحي هنا  ★★★     -->
        <!-- ======================================== -->
        <div class="hero-text">
    <h1> مرحبا بكم في شركة (خضرموت) في مدينة دمشق</h1>
    <p>نحن موجودون هنا في دمشق لتوصيل الخضار والفواكه بالاضافة الى تلبية طلبات الخضار الجاهزة</p>
            <h6>يمكنكم التواصل معنا عبر المنصات التالية </h6>
    <!-- إضافة مسافة رأسية 60 بكسل -->
    <div style="height: 60px;"></div>
</div>
        <!-- ======================================== -->
        <!-- ★★★  المستطيلات الثلاثة (عدّل الروابط)  ★★★ -->
        <!-- ======================================== -->
        <div class="cards-wrapper">

            <!-- 1. رابط فيسبوك -->
            <!-- غيّر الرابط داخل href="" إلى رابط صفحة فيسبوك الخاصة بك -->
            <a href="https://www.facebook.com/yourpage" target="_blank" class="card card-facebook">
                <i class="fab fa-facebook-f"></i>
                <span>فيسبوك</span>
            </a>

            <!-- 2. رابط تلغرام -->
            <!-- غيّر الرابط داخل href="" إلى رابط قناة أو مجموعة التلغرام -->
            <a href="https://t.me/yourchannel" target="_blank" class="card card-telegram">
                <i class="fab fa-telegram-plane"></i>
                <span>تلغرام</span>
            </a>

            <!-- 3. رابط واتساب -->
            <!-- غيّر الرابط داخل href="" إلى رابط واتساب (يمكنك استخدام رابط الدعوة المباشر) -->
            <a href="https://wa.me/966500000000" target="_blank" class="card card-whatsapp">
                <i class="fab fa-whatsapp"></i>
                <span>واتساب</span>
            </a>

        </div>
        <!-- نهاية المستطيلات -->

    </div>
    <!-- نهاية الحاوية -->

</body>
  </html>
